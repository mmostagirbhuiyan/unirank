# .github/workflows/update-rankings.yml
name: Update University Rankings

on:
  # Manual run
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to push updates to (default: main)'
        required: false
        default: main

  # Run on PRs that touch data or scripts
  pull_request:
    paths:
      - 'frontend/public/data/*.xlsx'
      - 'frontend/public/data/*.csv'
      - 'scripts/**'
      - '.github/workflows/update-rankings.yml'

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      # ---------- change detection ----------
      - name: Detect changed paths
        id: changed
        uses: dorny/paths-filter@v3
        with: |
          filters:
            usnews:
              - 'scripts/usnews_direct_extractor_selenium.py'
            data:
              - 'frontend/public/data/*.csv'
              - 'frontend/public/data/*.xlsx'
              - 'scripts/**'

      # ---------- runtimes ----------
      - name: Setup Node
        if: steps.changed.outputs.data == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Python
        if: steps.changed.outputs.data == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip

      # ---------- Python deps ----------
      - name: Install Python deps
        if: steps.changed.outputs.data == 'true' || steps.changed.outputs.usnews == 'true' || github.event_name == 'workflow_dispatch'
        run: pip install -r requirements.txt

      # ---------- US News fetch (only when file changes or manual) ----------
      - name: Fetch US News rankings
        if: steps.changed.outputs.usnews == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python scripts/usnews_direct_extractor_selenium.py \
            -o frontend/public/data/usnews_rankings.csv \
            -n 1000 -t 1500

      # ---------- Node install & aggregation ----------
      - name: Install Node deps
        if: steps.changed.outputs.data == 'true' || github.event_name == 'workflow_dispatch'
        run: npm install

      - name: Generate university name mapping
        if: steps.changed.outputs.data == 'true' || github.event_name == 'workflow_dispatch'
        run: node scripts/match-universities.js

      - name: Aggregate rankings
        if: steps.changed.outputs.data == 'true' || github.event_name == 'workflow_dispatch'
        run: node scripts/scrape-rankings.js

      # ---------- Validate output ----------
      - name: Validate aggregated JSON
        if: steps.changed.outputs.data == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          test -f frontend/public/data/aggregated-rankings.json
          jq empty frontend/public/data/aggregated-rankings.json

      # ---------- Commit & push ----------
      - name: Commit and push
        if: steps.changed.outputs.data == 'true' || steps.changed.outputs.usnews == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name  "github-actions"
          git add frontend/public/data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Automated rankings update ($(date -u '+%Y-%m-%d %H:%M UTC'))"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push origin HEAD:${{ github.head_ref }}
          else
            git push origin HEAD:${{ inputs.target_branch }}
          fi

      # ---------- Summary ----------
      - name: Job summary
        if: always()
        run: |
          echo "Update finished at $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"

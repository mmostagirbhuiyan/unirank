name: Aggregate Rankings

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/public/data/**'
      - 'scripts/**'
  push:
    branches:
      - main
    paths:
      - 'frontend/public/data/**'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Detect relevant changes
        id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            data:
              - 'frontend/public/data/*.csv'
            scripts:
              - 'scripts/**'

      - name: Setup Python
        if: steps.changed.outputs.data == 'true' || steps.changed.outputs.scripts == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip

      - name: Install Python dependencies
        if: steps.changed.outputs.data == 'true' || steps.changed.outputs.scripts == 'true' || github.event_name == 'workflow_dispatch'
        run: pip install -r requirements.txt

      - name: Setup Node
        if: steps.changed.outputs.data == 'true' || steps.changed.outputs.scripts == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        if: steps.changed.outputs.data == 'true' || steps.changed.outputs.scripts == 'true' || github.event_name == 'workflow_dispatch'
        run: npm install

      - name: Aggregate rankings
        if: steps.changed.outputs.data == 'true' || github.event_name == 'workflow_dispatch'
        run: node scripts/scrape-rankings.js

      - name: Validate aggregated JSON
        if: steps.changed.outputs.data == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          test -f frontend/public/data/aggregated-rankings.json
          jq empty frontend/public/data/aggregated-rankings.json

      - name: Commit results
        if: steps.changed.outputs.data == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name  "github-actions"
          git add frontend/public/data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Aggregate rankings ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          REF="${{ github.head_ref }}"
          if [ -z "$REF" ]; then
            REF="${{ github.ref_name }}"
          fi
          git push origin HEAD:$REF
